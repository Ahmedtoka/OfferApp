query Input($eligibleTags: [String!]!, $collectionIds: [ID!]!) {
  cart {
    cost { subtotalAmount { currencyCode } }
    lines {
      id
      quantity
      cost {
        amountPerQuantity { amount }
        compareAtAmountPerQuantity { amount }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product { id isGiftCard hasAnyTag(tags: $eligibleTags) inAnyCollection(ids: $collectionIds) }
        }
      }
    }
  }
  discount { discountClasses }
  localization { language { isoCode } }
  shop {
    metafield(namespace: "$app:bogo", key: "config") { value }
  }
}
